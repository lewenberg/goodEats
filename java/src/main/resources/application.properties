spring.datasource.url=${GOOD_EATS_DATABASE_URL:jdbc:h2:file:./data/food-ordering;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${GOOD_EATS_DATABASE_USERNAME:sa}
spring.datasource.password=${GOOD_EATS_DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
app.security.api-key=${GOOD_EATS_API_KEY:}
app.security.api-key-file=${GOOD_EATS_API_KEY_FILE:.api-key}
app.security.demo-tokens[token-admin-001].user-id=admin-001
app.security.demo-tokens[token-admin-001].email=admin@goodeats.test
app.security.demo-tokens[token-admin-001].role=admin
app.security.demo-tokens[token-owner-001].user-id=owner-001
app.security.demo-tokens[token-owner-001].email=maria@copperkettle.test
app.security.demo-tokens[token-owner-001].role=owner
app.security.demo-tokens[token-owner-002].user-id=owner-002
app.security.demo-tokens[token-owner-002].email=kenji@noodleworks.test
app.security.demo-tokens[token-owner-002].role=owner
app.security.demo-tokens[token-customer-001].user-id=customer-001
app.security.demo-tokens[token-customer-001].email=jordan@example.test
app.security.demo-tokens[token-customer-001].role=customer
app.security.demo-tokens[token-customer-002].user-id=customer-002
app.security.demo-tokens[token-customer-002].email=priya@example.test
app.security.demo-tokens[token-customer-002].role=customer
